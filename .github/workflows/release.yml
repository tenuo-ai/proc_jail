name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag and package versions
        run: python scripts/check_versions.py --tag "$GITHUB_REF_NAME"
      - name: Test workspace
        run: cargo test --all --all-features
      - name: Verify crates.io package
        run: cargo publish --dry-run

  build-rust:
    name: Build crates.io package
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package
      - uses: actions/upload-artifact@v4
        with:
          name: rust-package
          path: target/package/*.crate
          if-no-files-found: error

  build-python:
    name: Build Python wheel (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
            manylinux: auto
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - os: macos-15-intel
            target: x86_64
            manylinux: off
          - os: macos-15
            target: aarch64
            manylinux: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - name: Smoke-test wheel
        run: |
          python -m pip install --force-reinstall python/dist/*.whl
          python -c "import proc_jail, sys; assert proc_jail.__version__ == sys.argv[1]" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build Python source distribution
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1,<2" twine
      - run: maturin sdist --manifest-path python/Cargo.toml --out python/dist
      - run: twine check python/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  validate-python:
    name: Validate Python artifacts
    needs: [build-python, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - run: python -m pip install twine
      - run: twine check dist/*

  publish-rust:
    name: Publish to crates.io
    needs: [build-rust, validate-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    name: Publish to PyPI
    needs: [build-rust, validate-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: [publish-rust, publish-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
