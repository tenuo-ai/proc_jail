[package]
name = "proc_jail_python"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for proc_jail"
repository = "https://github.com/tenuo-ai/proc_jail"
publish = false

[lib]
name = "proc_jail_python"
crate-type = ["cdylib"]

[dependencies]
proc_jail = { path = ".." }
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
